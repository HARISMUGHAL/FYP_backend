## ──────────────────────────────────────────────────
##  FruitGrade System — Master Configuration
## ──────────────────────────────────────────────────
## Supports BOTH legacy ("data") and new ("dataset") keys.
## The ML pipeline uses flexible .get() lookups for safety.

# ── NEW-FORMAT dataset path ────────────────────────
dataset:
  path: "FruitGrade_Dataset"
  img_size: 224
  batch_size: 32
  num_workers: 0
  val_split: 0.2

# ── LEGACY data section (kept for backward compat) ─
data:
  raw_dir: "FruitGrade_Dataset"
  train_dir: "ml/data/train"
  val_dir: "ml/data/val"
  test_dir: "ml/data/test"
  image_extensions: [".jpg", ".jpeg", ".png"]
  skip_folders: ["real"]
  split_seed: 42
  train_ratio: 0.7
  val_ratio: 0.2
  test_ratio: 0.1
  min_file_size_bytes: 1024

# ── Preprocessing / Augmentation ───────────────────
preprocessing:
  image_size: 224
  resize_size: 256
  center_crop: 224
  mean: [0.485, 0.456, 0.406]
  std:  [0.229, 0.224, 0.225]
  random_horizontal_flip: true
  random_rotation_deg: 15
  color_jitter:
    brightness: 0.3
    contrast: 0.3
    saturation: 0.3
    hue: 0.1
  random_resized_crop:
    enabled: true
    scale_min: 0.60
    scale_max: 1.00
  random_grayscale_prob: 0.10

# ── Model ──────────────────────────────────────────
model:
  name: "efficientnet_b0"
  pretrained: true
  dropout_rate: 0.4
  save_path: ml/models/saved/model_v2.pth

# ── Training ───────────────────────────────────────
training:
  epochs: 10
  lr: 0.0003
  patience: 3
  early_stopping: true
  batch_size: 32
  num_workers: 0
  pin_memory: false

# ── Inference ──────────────────────────────────────
inference:
  device: "cpu"
  # 0.40 = 10x above random chance (1/27 ≈ 3.7%).
  # Lower than 0.55 to reduce false UNKNOWN on ambiguous B-grade fruits,
  # while still rejecting garbage / non-fruit images.
  confidence_threshold: 0.40

# -- Detection (YOLO) ------------------------------------------
# Safe dual-model setup:
#   weights     : PRIMARY model (custom fruit detector when ready)
#   weights_old : FALLBACK model (generic COCO, always works)
#
# The detector will:
#   1. Try to load PRIMARY weights
#   2. If file not found -> fall back to weights_old (COCO)
#   3. If both fail -> full-image fallback to classifier
#
# To switch to custom model after training:
#   Just place yolo_fruit_best.pt in ml/models/saved/
#   The detector will pick it up automatically on next restart.
detection:
  weights: "ml/models/saved/yolo_fruit_best.pt"
  weights_old: "yolov8n.pt"
  conf_threshold: 0.45
  iou_threshold: 0.45
  filter_coco_ids: []
  fallback_full_image: true
